name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # opencv comes from the headless wheel, not the `scanner` extra: same
          # cv2 module and the same contrib modules (cv2.aruco), without the
          # libGL the GUI build needs and a CI runner does not have. Without it
          # ~15 test modules fail to collect on every platform.
          python -m pip install -e ".[dev,server]" opencv-contrib-python-headless
      - name: Encoding check (UTF-8 + LF)
        run: python tools/check_encoding.py
      - name: Spec manifest verify
        run: python tools/verify_spec.py --all
      - name: Run tests
        # Coverage is reported, not gated. A threshold on a number that moves
        # with every new module turns a useful signal into a chore; the number
        # is here so a drop is visible in the log where someone reads it.
        # Baseline at the time this was added: 84% over 7110 statements.
        run: python -m pytest -q --cov=src/eopx --cov-report=term:skip-covered

  typescript:
    name: typescript sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  pwa:
    name: pwa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present
